name: React Docker CI-CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  react-ci:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔢 버전 자동 생성
      - name: Generate Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Generated version: $VERSION"

      # 🔍 검증 단계 (배포용 아님)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint / Type Check (optional)
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test Build (validation only)
        run: npm run build

      # 📦 배포 단계
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-northeast-2 | docker login \
            --username AWS \
            --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Build & Push Docker Image
        run: |
          VERSION=${{ steps.version.outputs.new_version }}
          REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/ktb-17/fe
          
          echo "🐳 Building image: $REPO:$VERSION"
          docker build -t $REPO:$VERSION .
          docker push $REPO:$VERSION
          
          echo "✅ Successfully pushed: $REPO:$VERSION"

#          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/ktb-17/fe:latest
#          docker build -t $IMAGE .
#          docker push $IMAGE,,ss


  react-cd:
    needs: react-ci
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          VERSION="${{ needs.react-ci.outputs.version }}"
          
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
  
            aws ecr get-login-password --region ap-northeast-2 | \
              sudo docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

            cd /home/${{ secrets.SERVER_USER }}
            
            export FRONTEND_VERSION=$VERSION
          
            echo "📦 Pulling image: fe:$VERSION"
          
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
          
            echo "✅ Deployment completed: version $VERSION"
          EOF
#             .env 파일 생성 (docker compose가 자동으로 읽음)
#            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" | sudo tee .env > /dev/null
#            echo "FRONTEND_VERSION=${{ needs.react-ci.outputs.version }}" | sudo tee -a .env > /dev/null